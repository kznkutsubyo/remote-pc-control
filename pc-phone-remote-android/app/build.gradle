plugins {
    id "com.android.application"
}

android {
    namespace "com.pcphoneremote.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.pcphoneremote.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        localRelease {
            initWith signingConfigs.debug
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.localRelease
            minifyEnabled false
            shrinkResources false
        }
    }
}
